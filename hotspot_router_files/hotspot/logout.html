<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logged Out - {CompanyName}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/hotspot.css">
    <link rel="icon" type="image/x-icon" href="favicon.ico">
</head>
<body>

<div class="main">
<div class="wrap">
    <div class="header">
        <div class="brand-logo" id="brandLogo"><img src="logo.png" alt="{CompanyName}" id="brandLogoImg"></div>
        <div class="brand" id="brandName">{CompanyName}</div>
    </div>

    <div class="card">
        <div class="success-box">
            <p style="font-weight:700;font-size:18px">Logged Out</p>
            <p>Your session has ended.</p>
        </div>

        <ul class="status-list">
            <li><span class="label">Username</span><span class="value">$(username)</span></li>
            <li><span class="label">Session duration</span><span class="value">$(uptime)</span></li>
            <li><span class="label">Downloaded</span><span class="value">$(bytes-out-nice)</span></li>
            <li><span class="label">Uploaded</span><span class="value">$(bytes-in-nice)</span></li>
        </ul>

        <a href="$(link-login)" class="btn btn-primary mt-16" style="text-decoration:none">Connect Again</a>
    </div>

    <div class="footer">
        <p>Powered by {CompanyName}</p>
    </div>
</div>
</div>

<script>
(function() {
    var img = document.getElementById('brandLogoImg');
    var logo = document.getElementById('brandLogo');
    var name = document.getElementById('brandName');
    if (!img || !logo || !name) return;
    img.onload = function() { logo.style.display = 'block'; name.style.display = 'none'; };
    img.onerror = function() { logo.style.display = 'none'; name.style.display = 'block'; };
    img.src = 'logo.png?' + Date.now();
})();
</script>

<script>
(function() {
    try {
        var data = new URLSearchParams();
        data.append('platformID', '{RouterIdentifier}');
        data.append('mac', '$(mac)');
        data.append('ip', '$(ip)');
        navigator.sendBeacon('{ApiBaseUrl}/api/hotspot/logout-notify', new Blob([data.toString()], { type: 'application/x-www-form-urlencoded' }));
    } catch(e) {}
})();
</script>

</body>
</html>
