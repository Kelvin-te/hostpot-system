<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logged Out</title>
    <link rel="stylesheet" href="css/hotspot.css">
</head>
<body>

<div class="card">
    <div class="brand"></div>
    <div class="success-box">
        <h2>Logged Out</h2>
        <p>Your hotspot session has ended.</p>
    </div>
    <a href="$(link-login)">Connect again</a>
</div>

<script>
(function() {
    try {
        var url = "{PortalUrl}/portal/mikrotik-logout?mac=$(mac)&ip=$(ip)&router={RouterIdentifier}";
        fetch(url, { method: 'POST', mode: 'no-cors' }).catch(function(){});
    } catch(e) {}
})();
</script>

</body>
</html>
