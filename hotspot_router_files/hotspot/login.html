<!--
    This is a GENERATED template. Placeholders such as {RouterIdentifier} and
    {PortalUrl} are auto-filled per router by
    RouterController::downloadHotspotFiles() / HotspotFileGeneratorService.
    Do not hand-edit and reuse this file across multiple routers - always
    (re)generate it from the admin panel so the identifier stays unique.
-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connecting...</title>
    <link rel="stylesheet" href="css/hotspot.css">
</head>
<body>

<div class="card">
    <div class="brand"></div>
    <div class="spinner"></div>
    <h2>Connecting...</h2>
    <p>Please wait while we redirect you to the portal.</p>

    <form id="portal" method="get"
          action="{PortalUrl}" style="display: none;">

    <input type="hidden" name="router" value="{RouterIdentifier}">

    <input type="hidden" name="mac" value="$(mac)">
    <input type="hidden" name="ip" value="$(ip)">
    <input type="hidden" name="link-login" value="$(link-login)">
    <input type="hidden" name="link-orig" value="$(link-orig)">
    <input type="hidden" name="chap-id" value="$(chap-id)">
    <input type="hidden" name="chap-challenge" value="$(chap-challenge)">

</form>

    <small>$(mac) &middot; $(ip)</small>
</div>

<script>
    document.getElementById('portal').submit();
</script>

</body>
</html>
