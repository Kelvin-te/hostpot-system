<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="refresh" content="2; url=$(link-redirect)">
    <meta http-equiv="pragma" content="no-cache">
    <meta http-equiv="expires" content="-1">
    <title>Connected - {CompanyName}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/hotspot.css">
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <script>
        function startClock() {
            $(if popup == 'true')
            open('$(link-status)', 'hotspot_status', 'toolbar=0,location=0,directories=0,status=0,menubars=0,resizable=1,width=290,height=200');
            $(endif)
            location.href = unescape('$(link-redirect-esc)');
        }
    </script>
</head>
<body onLoad="startClock()">

<div class="main">
<div class="wrap">
    <div class="header">
        <div class="brand-logo" id="brandLogo"><img src="logo.png" alt="{CompanyName}" id="brandLogoImg"></div>
        <div class="brand" id="brandName">{CompanyName}</div>
    </div>

    <div class="card">
        <div class="success-box">
            <p style="font-weight:800;font-size:22px;color:#0e770e">You are Connected!</p>
            <p>Your device is now authenticated.</p>
        </div>

        <p class="text-center mt-16" style="font-size:14px;color:#6b7280">
            If nothing happens, click <a href="$(link-redirect)" style="color:#0e770e;font-weight:600">here</a>
        </p>
    </div>

    <div class="footer">
        <p>Powered by {CompanyName}</p>
    </div>
</div>
</div>

<script>
(function() {
    var img = document.getElementById('brandLogoImg');
    var logo = document.getElementById('brandLogo');
    var name = document.getElementById('brandName');
    if (!img || !logo || !name) return;
    img.onload = function() { logo.style.display = 'block'; name.style.display = 'none'; };
    img.onerror = function() { logo.style.display = 'none'; name.style.display = 'block'; };
    var src = 'logo.png?' + Date.now();
    img.src = src;
})();
</script>

</body>
</html>
